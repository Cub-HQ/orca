      run: |
        set -euo pipefail
        cd "$W"
        python3 "$REVIEW_TIER" --base "$DIFF_BASE" --head "$REVIEW_HEAD" --repo "$R"
    - name: Independent review
      if: steps.resume.outputs.skip != 'true'
      timeout-minutes: ${{ fromJSON(steps.tier.outputs.timeout_minutes) }}
      env:
        READ_TOKEN: "${{ github.token }}"
        MODEL: "${{ steps.tier.outputs.model }}"
        EFFORT: "${{ steps.tier.outputs.effort }}"
        TIER: "${{ steps.tier.outputs.tier }}"
        MINUTES: "${{ steps.tier.outputs.minutes }}"
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$HOME/.local/npm-global/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
        echo "T0=$(date +%s)" >> "$GITHUB_ENV"
