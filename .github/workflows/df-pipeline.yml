      if: steps.resume.outputs.skip != 'true' && (always())
      env:
        MODEL: "${{ steps.tier.outputs.model }}"
        EFFORT: "${{ steps.tier.outputs.effort }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        if [ -z "${T0:-}" ] || [ ! -f "$REVIEW_STATE/review.jsonl" ]; then echo "stage never ran"; exit 0; fi
        cd "$REVIEW_STATE"
        SID=$(jq -r 'select(.type=="session") | .id' review.jsonl | head -1)
        DUR=$(( $(date +%s) - T0 )); DURFMT="$((DUR/60))m $((DUR%60))s"
        USAGE=$(jq -s -r '[.[] | select(.type=="message_end") | .message.usage // empty] | "\((map(.input//0)|add)//0) in + \((map(.output//0)|add)//0) out + \((map(.cacheRead//0)|add)//0) cached, cost $\((map(.cost as $c | if ($c|type)=="number" then $c elif ($c|type)=="object" then ($c.total//0) else 0 end)|add)//0)"' review.jsonl 2>/dev/null || echo "n/a")
        TOK=$(jq -s '[.[] | select(.type=="message_end") | .message.usage // empty] | (map(.input//0)|add//0) + (map(.output//0)|add//0)' review.jsonl 2>/dev/null || echo 0)
        echo "stats=${STAGE}|${MODEL}|${EFFORT}|${TOK}|${DUR}" >> "$GITHUB_OUTPUT"
        printf 'stage: %s\nmodel: %s\neffort: %s\nduration: %s\ntokens: %s\nresume: omp -r %s --cwd %s\n' "$STAGE" "$MODEL" "$EFFORT" "$DURFMT" "$USAGE" "$SID" "$W"
        printf '### %s\n- model: `%s`\n- effort: %s\n- duration: %s\n- tokens: %s\n- resume: `omp -r %s --cwd %s`\n\n' "$STAGE" "$MODEL" "$EFFORT" "$DURFMT" "$USAGE" "$SID" "$W" >> "$GITHUB_STEP_SUMMARY"
    - name: Review result and retryable receipt
      if: always() && steps.resume.outputs.skip != 'true'
      run: |
        set -euo pipefail
        REVIEW_STATE=${REVIEW_STATE:-$RUNNER_TEMP/review-failed-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}
        if [ ! -f "$REVIEW_STATE/result.json" ]; then
          mkdir -p "$REVIEW_STATE"
          printf '%s\n' '{"retryable":true,"verdict":"","reason":"Review infrastructure failed before a bound result was available; retry the failed job."}' > "$REVIEW_STATE/result.json"
        fi
        echo "REVIEW_STATE=$REVIEW_STATE" >> "$GITHUB_ENV"
        cat "$REVIEW_STATE/result.json" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ -f "${REVIEW_STATE:-}/verdict.txt" ]; then cat "$REVIEW_STATE/verdict.txt" >> "$GITHUB_STEP_SUMMARY"; fi
