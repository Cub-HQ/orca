          git clone --quiet "https://github.com/$R.git" "$W"
          cd "$W"
          git config user.name "df-pipeline"
          git config user.email "df-pipeline@users.noreply.github.com"
          PB=$(gh api "repos/$R/pulls/$PR" --jq .head.ref)
          echo "PB=$PB" >> "$GITHUB_ENV"
          git fetch --quiet origin "$PB"
          if git merge --no-commit --no-ff "origin/$PB" >/dev/null 2>&1; then
            git merge --abort 2>/dev/null || true
            echo "mode=none" >> "$GITHUB_OUTPUT"
            MSG="No rebase needed: nothing that merged ahead of this fix touches the same lines. It still lands on main cleanly."
          else
            CONF=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort 2>/dev/null || true
            echo "mode=conflict" >> "$GITHUB_OUTPUT"
            MSG=$(printf 'Rebase needed: another fix merged into main first and edits the same lines as PR #%s. A builder will replay this fix on top of it and combine the overlapping edits.\n\nWhere they overlap:\n%s' "$PR" "$CONF")
          fi
          printf '### Rebase check\n\n%s\n\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$MSG"
      - name: Combine with what merged first
        if: steps.chk.outputs.mode == 'conflict'
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PR: ${{ needs.build.outputs.pr }}
          R: ${{ github.repository }}
        run: |
          export PATH="/Users/joshuabretag/.local/npm-global/bin:/opt/homebrew/bin:$PATH"
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          cd "$W"
          git checkout --quiet -B "$PB" "origin/$PB"
          cat > brief.md <<EOF
          You are DF_Builder on a REBASE cycle. Read your card at /Users/joshuabretag/.omp/agent/agents/DF_Builder.md.
          - PR #$PR (the QA-approved fix for issue #$ISSUE on $R) no longer lands cleanly: another fix reached main first and edits the same lines. You are IN a checkout of the PR branch $PB.
          - Run git rebase origin/main and resolve EVERY conflict so BOTH fixes survive: keep what the newer code on main does AND keep this PR's intent. Never delete the other fix's changes to make yours fit.
          - Gates after the rebase: pnpm install --frozen-lockfile, pnpm run typecheck, pnpm run check:code-quality:changed, and the vitest files covering the changed paths (vitest run <changed test files>).
          - When green: git push --force-with-lease origin $PB. Post ONE comment on PR #$PR: first line DF_REBASE=done, second line HEAD_SHA=<full new head sha>, then in plain English which files overlapped and how you combined the two fixes.
          - Every GitHub read/write MUST use gh api (REST). The gh pr / gh issue subcommands are BANNED: GraphQL quota is exhausted and they fail.
          - Voice rule: Josh reads this and he is not a programmer. Write your whole comment so a smart 10-year-old gets it: short sentences, plain words, and any technical word gets a one-phrase explanation right there. Say what you did, what you found, and what happens next. Keep the machine lines exact and untouched (INTAKE=, DF_PR=, HEAD_SHA=, DF_REWORK=, DF_REBASE=, DF_REVIEW=, DF_QA=).
          - Reply DONE when pushed and posted.
          EOF
          omp -p --mode json --thinking "$EFFORT" --model "$MODEL" "@brief.md" | tee omp-events.jsonl | jq -rc --unbuffered 'if .type=="session" then "RESUME: omp -r \(.id) --cwd '"$W"'" elif .type=="tool_execution_start" then "-> \(.toolName): \(.intent // (.args.command // "" | .[0:80]))" elif .type=="message_end" and .message.role=="assistant" then ([.message.content[]? | select(.type=="text") | .text] | join(" ") | .[0:300] | select(length>0)) else empty end'
      - name: General Info
        id: gi
        if: always()
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          if [ -z "${T0:-}" ] || [ ! -f "$W/omp-events.jsonl" ]; then echo "stage never ran"; exit 0; fi
          cd "$W"
          SID=$(jq -r 'select(.type=="session") | .id' omp-events.jsonl | head -1)
          DUR=$(( $(date +%s) - T0 )); DURFMT="$((DUR/60))m $((DUR%60))s"
          USAGE=$(jq -s -r '[.[] | select(.type=="message_end") | .message.usage // empty] | "\((map(.input//0)|add)//0) in + \((map(.output//0)|add)//0) out + \((map(.cacheRead//0)|add)//0) cached, cost $\((map(.cost as $c | if ($c|type)=="number" then $c elif ($c|type)=="object" then ($c.total//0) else 0 end)|add)//0)"' omp-events.jsonl 2>/dev/null || echo "n/a")
          TOK=$(jq -s '[.[] | select(.type=="message_end") | .message.usage // empty] | (map(.input//0)|add//0) + (map(.output//0)|add//0)' omp-events.jsonl 2>/dev/null || echo 0)
          echo "stats=${STAGE}|${MODEL}|${EFFORT}|${TOK}|${DUR}" >> "$GITHUB_OUTPUT"
          printf 'stage: %s\nmodel: %s\neffort: %s\nduration: %s\ntokens: %s\nresume: omp -r %s --cwd %s\n' "$STAGE" "$MODEL" "$EFFORT" "$DURFMT" "$USAGE" "$SID" "$W"
          printf '### %s\n- model: `%s`\n- effort: %s\n- duration: %s\n- tokens: %s\n- resume: `omp -r %s --cwd %s`\n\n' "$STAGE" "$MODEL" "$EFFORT" "$DURFMT" "$USAGE" "$SID" "$W" >> "$GITHUB_STEP_SUMMARY"
      - name: "Hand-off → Ship"
        if: steps.chk.outputs.mode == 'conflict'
        env:
          PR: ${{ needs.build.outputs.pr }}
          R: ${{ github.repository }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd "$W"
          git fetch --quiet origin main "$PB"
          git merge-base --is-ancestor origin/main "origin/$PB"
          B=$(gh api "repos/$R/issues/$PR/comments" --paginate --jq '[.[] | select(.body|startswith("DF_REBASE="))] | last | .body')
          printf '### Hand-off → Ship\n\n%s\n\n' "$B" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$B"
          test -n "$B"
  ship:
    name: "Ship"
    needs: [build, qa, rebase]
    if: always() && needs.qa.outputs.qa == 'pass' && needs.rebase.result == 'success'
    runs-on: [self-hosted, m4]
    timeout-minutes: 10
    steps:
      - name: Checkout board sync
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: main
          path: board-stage
          sparse-checkout: tools/board_sync.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set board stage to Deploying
        continue-on-error: true
        working-directory: board-stage
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          R: ${{ github.repository }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 tools/board_sync.py --repo "$R" --issue "$ISSUE" --stage "Deploying" --run-url "https://github.com/$R/actions/runs/$GITHUB_RUN_ID"
      - name: Stage label
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          R: ${{ github.repository }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          for L in building pr-open reviewed awaiting-review blocked merged deployed; do gh api -X DELETE "repos/$R/issues/$ISSUE/labels/factory%3A$L" >/dev/null 2>&1 || true; done
          gh api -X POST "repos/$R/issues/$ISSUE/labels" -f "labels[]=factory:merged" >/dev/null 2>&1 || true
      - name: Merge and close
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PR: ${{ needs.build.outputs.pr }}
          R: ${{ github.repository }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          PB=$(gh api "repos/$R/pulls/$PR" --jq .head.ref)
          gh api -X PUT "repos/$R/pulls/$PR/merge" -f merge_method=squash >/dev/null
          gh api -X DELETE "repos/$R/git/refs/heads/$PB" >/dev/null 2>&1 || true
          M=$(gh api "repos/$R/pulls/$PR" --jq '.merge_commit_sha')
          gh api -X POST "repos/$R/issues/$ISSUE/comments" -f body="Shipped. The fix (PR #$PR) passed an independent review and a QA attack, so it was merged into main automatically. Merge commit: $M. Want to see it with your own eyes? Scroll up to the '## DF_QA' comment - its 'Try it yourself (for Josh)' section is a step-by-step recipe." >/dev/null
          gh api -X PATCH "repos/$R/issues/$ISSUE" -f state=closed >/dev/null
  finalize:
    name: "Verdict"
    needs: [intake, build, review1, rework, review2, qa, rebase, ship]
    if: always() && needs.intake.result != 'skipped'
    runs-on: [self-hosted, m4]
    timeout-minutes: 10
    steps:
      - name: Apply outcome
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PR: ${{ needs.build.outputs.pr }}
          GO: ${{ needs.intake.outputs.go }}
          BR: ${{ needs.build.result }}
          V1: ${{ needs.review1.outputs.verdict }}
          V2: ${{ needs.review2.outputs.verdict }}
          QA: ${{ needs.qa.outputs.qa }}
          SHIP: ${{ needs.ship.result }}
          R: ${{ github.repository }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          for L in "actions:parked|b60205" "actions:needs-info|fbca04" "actions:shipped|0e8a16"; do
            gh api -X POST "repos/$R/labels" -f name="${L%%|*}" -f color="${L##*|}" >/dev/null 2>&1 || true
          done
          echo "go=$GO build=$BR v1=$V1 v2=$V2 qa=$QA ship=$SHIP pr=$PR"
          mark() { gh api -X POST "repos/$R/issues/$ISSUE/labels" -f "labels[]=$1" >/dev/null; gh api -X DELETE "repos/$R/issues/$ISSUE/labels/actions%3Ago" >/dev/null 2>&1 || true; }
          say() { gh api -X POST "repos/$R/issues/$ISSUE/comments" -f body="$1" >/dev/null; }
          if [ "$GO" = "needs-info" ]; then
            mark "actions:needs-info"
          elif [ "$BR" != "success" ]; then
            mark "actions:parked"; say "The build step broke, so I parked this one for you. Open the run page and click the Build box to see what went wrong."
          elif [ "$SHIP" = "success" ]; then
            mark "actions:shipped"
          elif [ "$QA" = "fail" ]; then
            mark "actions:parked"; say "The reviewer approved the fix (PR #$PR), but QA tried to break it and DID. Parked for you - read the DF_QA comment above to see exactly what broke."
          elif [ "$V1" = "approve" ] || [ "$V2" = "approve" ]; then
            mark "actions:parked"; say "The fix (PR #$PR) was approved, but the last steps did not finish (qa=$QA, merge=$SHIP). Parked for you."
          else
            mark "actions:parked"; say "The builder fixed once, but the reviewer still says no (first review=$V1, second look=$V2). Parked for you - the newest DF_Reviewer comment on PR #$PR says why."
          fi
      - name: "For Josh"
        if: always()
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PR: ${{ needs.build.outputs.pr }}
          GO: ${{ needs.intake.outputs.go }}
          V1: ${{ needs.review1.outputs.verdict }}
          V2: ${{ needs.review2.outputs.verdict }}
          QA: ${{ needs.qa.outputs.qa }}
          SHIP: ${{ needs.ship.result }}
          R: ${{ github.repository }}
          STI: ${{ needs.intake.outputs.stats }}
          STB: ${{ needs.build.outputs.stats }}
          STR1: ${{ needs.review1.outputs.stats }}
          STRW: ${{ needs.rework.outputs.stats }}
          STR2: ${{ needs.review2.outputs.stats }}
          STQ: ${{ needs.qa.outputs.stats }}
          STRB: ${{ needs.rebase.outputs.stats }}
          RB: ${{ needs.rebase.result }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          T=$(gh api "repos/$R/issues/$ISSUE" --jq .title)
          BODY=$(gh api "repos/$R/issues/$ISSUE" --jq '.body // ""' | awk 'NF==0 && n>400 {exit} {print; n+=length($0)}' | head -c 2000)
          QAB=$(gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body|startswith("## DF_QA"))] | last | .body' 2>/dev/null || true)
          TRY=$(printf '%s\n' "$QAB" | awk '/^### Try it yourself/{f=1} f && /^### / && !/^### Try it yourself/{exit} f && !/^\*\*Hand-off/{print}')
          TABLE=$(for S in "$STI" "$STB" "$STR1" "$STRW" "$STR2" "$STQ" "$STRB"; do if [ -n "$S" ]; then printf '%s\n' "$S"; fi; done | awk -F'|' '
            function commas(n, s,r){ r=sprintf("%d",n); s=""; while (length(r)>3){ s="," substr(r,length(r)-2) s; r=substr(r,1,length(r)-3)} return r s }
            function hms(d){ return sprintf("%02d:%02d:%02d", d/3600, (d%3600)/60, d%60) }
            { name=$1; sub(/ V[0-9]+$/,"",name); model=$2; sub(/^oauth-pool\//,"",model); eff=$3; tok=$4+0; dur=$5+0
              printf("| %s | %s | %s | %s tokens | %s |\n", name, model, eff, commas(tok), hms(dur))
              tt+=tok; td+=dur; m[model]+=tok }
            END { if (NR==0) exit
              print ""
              print "**Totals**"
              print ""
              print "Tokens:"
              for (k in m) printf("- %s: %s tokens\n", k, commas(m[k]))
              printf("- All models together: %s tokens\n", commas(tt))
              print ""
              printf("Time: %s\n", hms(td)) }')
          PRCELL="no PR was made"
          if [ -n "$PR" ]; then PRCELL="[PR #$PR](https://github.com/$R/pull/$PR)"; fi
          GI=$(printf '%s\n' "| What | Status |" "|---|---|" "| Issue | [#$ISSUE: $T](https://github.com/$R/issues/$ISSUE) |" "| The fix | $PRCELL |" "| Front door check | ${GO:--} |" "| First review | ${V1:--} |" "| Second review | ${V2:--} |" "| QA attack | ${QA:--} |" "| Rebased onto newest main | ${RB:--} |" "| Merged into main | ${SHIP:--} |")
          DETAIL=""
          if [ "$GO" = "needs-info" ]; then OUT="Stopped at the front door: I need answers from you first. My questions are below."
            DETAIL=$(gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body|startswith("## DF_Intake"))] | last | .body' 2>/dev/null || true)
          elif [ "$SHIP" = "success" ]; then OUT="Shipped. The fix (PR #$PR) was built, independently reviewed, QA-attacked, and merged into main. The issue is closed."
          elif [ "$QA" = "fail" ]; then OUT="Not shipped: QA tried to break the fix (PR #$PR) and DID. QA's full writeup is below - what broke, the proof, and how to reproduce it."
            DETAIL="$QAB"
          elif [ "$V1" = "block" ] && [ "$V2" != "approve" ]; then OUT="Not shipped: the reviewer said no twice (PR #$PR). The reviewer's full findings are below."
            DETAIL=$(gh api "repos/$R/issues/$PR/comments" --paginate --jq '[.[] | select(.body|startswith("## DF_Reviewer"))] | last | .body' 2>/dev/null || true)
          elif [ -z "$PR" ]; then OUT="Not shipped: the build stage never produced a fix. The build's last words are below."
            DETAIL=$(gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select((.body|startswith("## DF_")) or (.body|startswith("DF_")))] | last | .body' 2>/dev/null || true)
          else OUT="Not shipped: the fix (PR #$PR) got approved but the tail end did not finish (qa=$QA, merge=$SHIP). The newest stage report is below."
            DETAIL=$(gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body|startswith("## DF_"))] | last | .body' 2>/dev/null || true)
          fi
          if [ "$GO" = "needs-info" ]; then FL="needs-info"
          elif [ "$SHIP" = "success" ]; then FL=""
          else FL="needs-you"
          fi
          for L in building pr-open reviewed awaiting-review blocked merged deployed needs-info needs-you; do gh api -X DELETE "repos/$R/issues/$ISSUE/labels/factory%3A$L" >/dev/null 2>&1 || true; done
          if [ -n "$FL" ]; then
            gh api -X POST "repos/$R/issues/$ISSUE/labels" -f "labels[]=factory:$FL" >/dev/null 2>&1 || true
          fi
          {
            echo "# For Josh: the whole story in one place"
            echo
            echo "## General information"
            echo
            printf '%s\n' "$GI"
            echo
            echo "## 1. What we were fixing"
            echo "**Issue #$ISSUE: $T** ([open it](https://github.com/$R/issues/$ISSUE))"
            echo
            printf '%s\n' "$BODY"
            echo
            echo "## 2. What happened"
            echo "$OUT"
            echo
            if [ -n "$DETAIL" ]; then
              printf '%s\n' "$DETAIL"
              echo
            fi
            if [ -n "$TRY" ]; then
              echo "## 3. How to test it yourself"
              printf '%s\n' "$TRY"
            fi
            if [ -n "$TABLE" ]; then
              echo
              echo "## 4. Time and tokens by stage"
              echo
              echo "| Stage | Model | Effort | Tokens used | Time |"
              echo "|---|---|---|---|---|"
              printf '%s\n' "$TABLE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n\n%s\n' "$OUT" "$GI"
