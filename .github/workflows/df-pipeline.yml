  review1:
    name: Review
    needs:
    - admission
    - intake
    - build
    if: needs.admission.outputs.go == 'true'
    runs-on: [self-hosted, hetzner]
    timeout-minutes: 45
    outputs:
      stats: "${{ steps.gi.outputs.stats }}"
      verdict: "${{ steps.v.outputs.verdict || steps.resume.outputs.verdict }}"
    steps:
    - name: Prepare portable model runtime
      run: |
        set -euo pipefail
        for BIN in "$HOME/.local/bin" "$HOME/.local/npm-global/bin" /opt/homebrew/bin /usr/local/bin; do echo "$BIN" >> "$GITHUB_PATH"; done
    - name: Load receipt and lease guard
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        PR: "${{ needs.build.outputs.pr }}"
      run: |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:$PATH"
        D=$(mktemp -d "$RUNNER_TEMP/factory-review-$GITHUB_RUN_ID.XXXXXX")
        for TOOL in factory_receipts.py review_run.py review_tier; do
          GH_TOKEN="$READ_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" "repos/$R/contents/tools/$TOOL?ref=$GITHUB_SHA" > "$D/$TOOL"
        done
        GH_TOKEN="$READ_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" "repos/$R/contents/agent/agents/DF_Reviewer.md?ref=$GITHUB_SHA" > "$D/DF_Reviewer.md"
        { echo "RECEIPTS=$D/factory_receipts.py"; echo "REVIEW_RUN=$D/review_run.py"; echo "REVIEW_TIER=$D/review_tier"; echo "REVIEW_STATE=$D/state"; } >> "$GITHUB_ENV"
    - name: Current issue, lease, and durable receipt
      id: resume
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        PR: "${{ needs.build.outputs.pr }}"
      run: |
        python3 "$RECEIPTS" guard --stage review1
        python3 "$RECEIPTS" resume review1
    - name: Checkout board sync
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: main
        path: board-stage
        sparse-checkout: tools/board_sync.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
      if: steps.resume.outputs.skip != 'true'
    - name: Set board stage to In review
      continue-on-error: true
      working-directory: board-stage
      env:
        GH_TOKEN: "${{ github.token }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        python3 tools/board_sync.py --repo "$R" --issue "$ISSUE" --stage "In review" --run-url "https://github.com/$R/actions/runs/$GITHUB_RUN_ID"
      if: steps.resume.outputs.skip != 'true'
    - name: Stage label
      env:
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        python3 "$RECEIPTS" stage-label --label factory:pr-open
      if: steps.resume.outputs.skip != 'true'
    - name: Checkout exact open PR head
      if: steps.resume.outputs.skip != 'true'
      env:
        READ_TOKEN: "${{ github.token }}"
        PR: "${{ needs.build.outputs.pr }}"
        R: "${{ github.repository }}"
      run: |
        set -euo pipefail
        PR_JSON=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$R/pulls/$PR")
        test "$(jq -r .state <<< "$PR_JSON")" = open
        HEAD_SHA=$(jq -r .head.sha <<< "$PR_JSON")
        BASE_SHA=$(jq -r .base.sha <<< "$PR_JSON")
        W=$(mktemp -d "$RUNNER_TEMP/pipe-review1-$PR.XXXXXX")
        { echo "W=$W"; echo "HEAD_SHA=$HEAD_SHA"; echo "BASE_SHA=$BASE_SHA"; echo "STAGE=Review V1"; } >> "$GITHUB_ENV"
