      if: always() && steps.resume.outputs.skip != 'true' && env.REVIEW_STATE != ''
      uses: actions/upload-artifact@v4
      with:
        name: review1-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.REVIEW_STATE }}
        if-no-files-found: ignore
    - name: Hand-off → Rework / QA
      id: v
      if: steps.resume.outputs.skip != 'true'
      run: |
        set -euo pipefail
        V=$(jq -er --arg sha "$HEAD_SHA" 'select(.head_sha == $sha) | .verdict | select(. == "approve" or . == "block")' "$REVIEW_STATE/result.json")
        echo "verdict=$V" >> "$GITHUB_OUTPUT"
        echo "verdict: $V"
    - name: Save current-state completion receipt
      if: success() && steps.resume.outputs.skip != 'true'
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        PR: "${{ needs.build.outputs.pr }}"
      run: 'python3 "$RECEIPTS" record review1

