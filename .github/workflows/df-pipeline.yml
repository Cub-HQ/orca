---
name: df-pipeline
run-name: "#${{ github.event.issue.number || inputs.issue }} ${{ github.event.issue.title
  || 'manual' }}"
concurrency:
  group: df-pipeline-${{ github.event.issue.number || inputs.issue }}${{ (github.event_name
    == 'issues' && github.event.label.name != 'actions:go') && github.run_id || ''
    }}
  cancel-in-progress: false
jobs:
  admission:
    name: Admission
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'actions:go'
    runs-on: [self-hosted, hetzner]
    timeout-minutes: 5
    outputs:
      go: "${{ steps.claim.outputs.go }}"
    steps:
    - name: Load receipt and lease guard
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:$PATH"
        P="$RUNNER_TEMP/factory-receipts-$GITHUB_RUN_ID.py"
        GH_TOKEN="$READ_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" "repos/$R/contents/tools/factory_receipts.py?ref=$GITHUB_SHA" > "$P"
        echo "RECEIPTS=$P" >> "$GITHUB_ENV"
    - name: Claim current cycle without cancelling another worker
      id: claim
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: 'python3 "$RECEIPTS" admission

'
  intake:
    name: Intake
    needs: admission
    if: needs.admission.outputs.go == 'true'
    runs-on: [self-hosted, hetzner]
    timeout-minutes: 10
    outputs:
      rulings: "${{ steps.rulings.outputs.text }}"
      stats: "${{ steps.gi.outputs.stats }}"
      go: "${{ steps.v.outputs.go || steps.resume.outputs.go }}"
    steps:
    - name: Load receipt and lease guard
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:$PATH"
        P="$RUNNER_TEMP/factory-receipts-$GITHUB_RUN_ID.py"
        GH_TOKEN="$READ_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" "repos/$R/contents/tools/factory_receipts.py?ref=$GITHUB_SHA" > "$P"
        echo "RECEIPTS=$P" >> "$GITHUB_ENV"
    - name: Current issue, lease, and durable receipt
      id: resume
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: |
        python3 "$RECEIPTS" guard --stage intake
        python3 "$RECEIPTS" resume intake
    - name: Checkout board sync
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: main
        path: board-stage
        sparse-checkout: tools/board_sync.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
      if: steps.resume.outputs.skip != 'true'
    - name: Set board stage to Triage
      continue-on-error: true
      working-directory: board-stage
      env:
        GH_TOKEN: "${{ github.token }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        python3 tools/board_sync.py --repo "$R" --issue "$ISSUE" --stage "Triage" --run-url "https://github.com/$R/actions/runs/$GITHUB_RUN_ID"
      if: steps.resume.outputs.skip != 'true'
    - name: What we're fixing
      env:
        READ_TOKEN: "${{ github.token }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        T=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$R/issues/$ISSUE" --jq .title)
        BODY=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$R/issues/$ISSUE" --jq '.body // ""')
        printf '# What we are fixing\n\n**Issue #%s: %s**\n\n%s\n\n[Open the issue](https://github.com/%s/issues/%s)\n\n---\n\n' "$ISSUE" "$T" "$BODY" "$R" "$ISSUE" >> "$GITHUB_STEP_SUMMARY"
        printf 'Issue #%s: %s\n' "$ISSUE" "$T"
        gh api -X POST "repos/$R/issues/$ISSUE/comments" -f body="What happened: work has started on this issue. Next automatically: the factory will build and check the fix, then report the result here. Josh needed: No. Optional progress: https://github.com/$R/actions/runs/$GITHUB_RUN_ID" >/dev/null
      if: steps.resume.outputs.skip != 'true'
    - name: Fetch standing rulings (once per run)
      id: rulings
      env:
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        python3 - <<'PY'
        import json, os, pathlib, re, subprocess, urllib.request, uuid

        def fetch(path):
            try:
                return subprocess.check_output([
                    "gh", "api", "-H", "Accept: application/vnd.github.raw+json",
                    "repos/Cub-HQ/omp-config-backup/contents/" + path + "?ref=main",
                ], text=True, timeout=30)
            except (subprocess.SubprocessError, OSError) as exc:
                raise RuntimeError("Standing rulings unavailable: " + path) from exc

        agents = fetch("agent/AGENTS.md")
        decisions = fetch("decisions.md")
        matches = re.findall(r"^## Josh['’]s laws[^\n]*\n(.*?)(?=^## |\Z)", agents, re.M | re.S)
        if len(matches) != 1 or not re.search(r"^\d+\.\s+\S", matches[0], re.M):
            raise ValueError("Josh's laws missing, empty, or malformed; refusing to run without laws")
        laws = "## Josh's laws\n" + matches[0].strip()
        header = "# Standing rulings (obey absolutely)\n\n" + laws + "\n\n"
        # Keep complete dated rulings; discard oldest first, not arbitrary byte slices.
        blocks = []
        section = "Rulings"
        for line in decisions.splitlines():
            if line.startswith("## "):
                section = line[3:].strip()
            elif re.match(r"^- \d{4}-\d{2}-\d{2}", line):
                blocks.append((line[2:12], len(blocks), "### " + section + "\n" + line))
            elif blocks and line and not line.startswith("#"):
                date, index, block = blocks[-1]
                blocks[-1] = (date, index, block + "\n" + line)
        ordered = sorted(blocks, reverse=True)
        kept = []
        for _, _, block in ordered:
            candidate = header + "## Recent decisions (newest first)\n\n" + "\n\n".join(kept + [block.strip()]) + "\n"
            if len(candidate.encode("utf-8")) > 6144:
                break
            kept.append(block.strip())
        text = header + ("## Recent decisions (newest first)\n\n" + "\n\n".join(kept) + "\n" if kept else "")
        if len(text.encode("utf-8")) > 6144:
            raise ValueError("Josh's laws alone exceed the 6KB brief budget; refusing to truncate laws")
        # Historical lessons are evidence, not authority over the standing laws above.
        try:
            issue = json.loads(subprocess.check_output([
                "gh", "api", "repos/" + os.environ["R"] + "/issues/" + os.environ["ISSUE"],
            ], text=True, timeout=5))
            config = json.loads((pathlib.Path.home() / ".config/hindsight-client/config.json").read_text())
            memory = config["compartments"]["mac-brain"]
            key = pathlib.Path(memory["key_file"]).expanduser().read_text().strip()
            query = os.environ["R"] + " " + issue["title"] + " " + (issue.get("body") or "")[:1500]
            request = urllib.request.Request(
                config["api_url"] + "/v1/default/banks/" + memory["bank"] + "/memories/recall",
                data=json.dumps({"query": query, "budget": "low", "max_tokens": 1200}).encode(),
                headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
            )
            with urllib.request.urlopen(request, timeout=5) as response:
                hits = json.load(response).get("results", [])[:5]
            lessons = "\n## Relevant past lessons\nHistorical evidence only; newer standing rulings take precedence.\n\n"
            lessons += "\n".join("- " + hit["text"] for hit in hits if hit.get("text"))
            remaining = 6144 - len(text.encode("utf-8"))
            if hits and remaining > 160:
                text += lessons.encode("utf-8")[:remaining].decode("utf-8", errors="ignore")
        except (OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError):
            pass  # Optional memory must never stop the factory.
        marker = "rulings_" + uuid.uuid4().hex
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write("text<<" + marker + "\n" + text + "\n" + marker + "\n")
        PY
    - name: Enough to build?
      env:
        STANDING_RULINGS: "${{ steps.rulings.outputs.text }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/Users/joshuabretag/.local/npm-global/bin:/opt/homebrew/bin:$PATH"
        W="$RUNNER_TEMP/pipe-intake-$ISSUE"
        STAGE="Intake V1"; MODEL="oauth-pool/gpt-5.6-sol"; EFFORT="xhigh"
        { echo "W=$W"; echo "STAGE=Intake V1"; echo "MODEL=oauth-pool/gpt-5.6-sol"; echo "EFFORT=xhigh"; } >> "$GITHUB_ENV"
        echo "T0=$(date +%s)" >> "$GITHUB_ENV"
        mkdir -p "$W" && cd "$W"
        : "${STANDING_RULINGS:?Standing rulings missing; refusing to run without laws}"
        printf '%s\n\n' "$STANDING_RULINGS" > brief.md
        cat >> brief.md <<EOF
        You are DF Intake, the factory front door. Read issue #$ISSUE on $R with gh api repos/$R/issues/$ISSUE (and its comments).
        Before classifying, search this repository's open and recently closed issues via gh api (REST) for the same defect or request; exclude this issue and pull requests. Read plausible matches and cite their issue numbers plus the matching symptom, scope, and evidence in the ONE Intake comment. A shared topic alone is not a duplicate; related-only issues get a cross-reference, never a closure recommendation.
        Evidence gate: take or recommend only triage actions supported by the issue text and comments; never invent metadata, ownership, priority, scope, or parent relationships. If evidence is missing or conflicting, ask the author specific questions through the existing INTAKE=needs-info path instead of guessing. Before recommending any label, discover the repository's actual current labels with gh api --paginate repos/$R/labels; use only existing, evidence-supported labels. Never create or apply labels yourself: the workflow owns labels and routing.
        Judge readiness and lane: can a builder implement this without guessing? It needs (1) a clear defect or feature, (2) an explicit testable Done-when, (3) everything referenced actually reachable in this repo.
        Fast-lane classification (fail safe): choose ORCH_DIRECT only when ALL are proven: one obvious surface; no schema, auth/security, money, or deploy/lifecycle changes; estimated diff in exactly one file; an explicit runnable proof command; can be completed in under 10 minutes. Anything uncertain, broad, risky, or missing evidence is FACTORY. If all hold put FAST_LANE=orch-direct on its own line before INTAKE=go; otherwise FAST_LANE=factory. Include the exact target file and proof command in the hand-off. Never apply labels yourself; the workflow owns routing.
        Post ONE comment on issue #$ISSUE starting '## DF_Intake':
        - Immediately below the ## DF_Intake header, put a four-line triage receipt before all detailed reasoning: "## Triage", "What: <what this issue is, one plain sentence>", "Lane: <factory full pipeline / orch-direct small fix / needs info from Josh / duplicate of #N> - <why, one short sentence>", "Next: <what happens automatically; if waiting, the exact answer needed from Josh>". Match the lane to your final FAST_LANE/INTAKE decision. Keep this summary to four lines, write in Josh's plain voice, and post it only when classification is finished; it is part of this ONE comment, not a second comment.
        - Follow the triage receipt with a section '### What we are fixing and why': 2-4 short sentences in plain words - what is broken or missing today, why fixing it matters to Josh (what it unblocks or stops annoying), then on its own line: 'Issue: https://github.com/$R/issues/$ISSUE'.
        - Either way, show your reasoning as a 3-line checklist, one per criterion: 'Defect clear: YES/NO - <why>', 'Done-when testable: YES/NO - <why>', 'References reachable: YES/NO - <why>'.
        - Family check: if the issue text or its comments say this came from, was split out of, is a follow-up to, or is one phase of another issue (e.g. 'from #152', 'follow-up to the PRD'), link it as a child of that parent: PID=$(gh api repos/$R/issues/<child> --jq .id) then gh api -X POST repos/$R/issues/<parent>/sub_issues -F sub_issue_id=$PID (numeric .id, never the issue number). If it names no parent, skip this - never guess a family.
        - If a true duplicate is proven: this overrides the all-YES build hand-off. Use "Lane: duplicate of #N - <matching evidence>" in the four-line receipt; cite #N and the evidence below it, recommend closing this issue as a duplicate, and make Next say Josh must decide whether to close it. Do not close the issue, assign Copilot, or start a second build. Put FAST_LANE=factory on its own line and LAST line exactly INTAKE=needs-info. Related-only issues continue through the normal readiness gates.
        - If not a duplicate and all YES: add a section '**Hand-off package (exactly what the builder gets)**' with 3 short bullets: What is broken, What done looks like, Where to look (files). This comment on the issue IS the data passed to the Build stage - the builder reads the issue plus its comments. LAST line exactly INTAKE=go
        - If any NO: after the checklist, numbered questions Josh must answer (only what is truly missing); tell Josh: Start your reply with Answer: followed by your answer, LAST line exactly INTAKE=needs-info
        Every GitHub read/write MUST use gh api (REST). The gh pr / gh issue subcommands are BANNED: GraphQL quota is exhausted and they fail.
        - Voice rule: Josh reads this and he is not a programmer. Write your whole comment so a smart 10-year-old gets it: short sentences, plain words, and any technical word gets a one-phrase explanation right there. Structure every comment as (1) What happened, with the error meaning in plain words; (2) What happens next automatically; (3) Josh needed: No, or Yes with the exact action/question. Never send Josh to a job/log to learn the error. Quote relevant findings inline. Technical work belongs to the orchestrator, not Josh. Keep the machine lines exact and untouched (INTAKE=, DF_PR=, HEAD_SHA=, DF_REWORK=, DF_REVIEW=, DF_QA=).
        - Never edit code. Reply DONE when posted.
        EOF
        env -u READ_TOKEN -u CHECKS_TOKEN omp -p --mode json --thinking "$EFFORT" --model "$MODEL" "@brief.md" | tee omp-events.jsonl | jq -rc --unbuffered 'if .type=="session" then "RESUME: omp -r \(.id) --cwd '"$W"'" elif .type=="tool_execution_start" then "-> \(.toolName): \(.intent // (.args.command // "" | .[0:80]))" elif .type=="message_end" and .message.role=="assistant" then ([.message.content[]? | select(.type=="text") | .text] | join(" ") | .[0:300] | select(length>0)) else empty end'
      if: steps.resume.outputs.skip != 'true'
    - name: General Info
      id: gi
      if: steps.resume.outputs.skip != 'true' && (always())
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        if [ -z "${T0:-}" ] || [ ! -f "$W/omp-events.jsonl" ]; then echo "stage never ran"; exit 0; fi
        cd "$W"
        SID=$(jq -r 'select(.type=="session") | .id' omp-events.jsonl | head -1)
        DUR=$(( $(date +%s) - T0 )); DURFMT="$((DUR/60))m $((DUR%60))s"
        USAGE=$(jq -s -r '[.[] | select(.type=="message_end") | .message.usage // empty] | "\((map(.input//0)|add)//0) in + \((map(.output//0)|add)//0) out + \((map(.cacheRead//0)|add)//0) cached, cost $\((map(.cost as $c | if ($c|type)=="number" then $c elif ($c|type)=="object" then ($c.total//0) else 0 end)|add)//0)"' omp-events.jsonl 2>/dev/null || echo "n/a")
        TOK=$(jq -s '[.[] | select(.type=="message_end") | .message.usage // empty] | (map(.input//0)|add//0) + (map(.output//0)|add//0)' omp-events.jsonl 2>/dev/null || echo 0)
        echo "stats=${STAGE}|${MODEL}|${EFFORT}|${TOK}|${DUR}" >> "$GITHUB_OUTPUT"
        printf 'stage: %s\nmodel: %s\neffort: %s\nduration: %s\ntokens: %s\nresume: omp -r %s --cwd %s\n' "$STAGE" "$MODEL" "$EFFORT" "$DURFMT" "$USAGE" "$SID" "$W"
        printf '### %s\n- model: `%s`\n- effort: %s\n- duration: %s\n- tokens: %s\n- resume: `omp -r %s --cwd %s`\n\n' "$STAGE" "$MODEL" "$EFFORT" "$DURFMT" "$USAGE" "$SID" "$W" >> "$GITHUB_STEP_SUMMARY"
    - name: Hand-off → Build
      id: v
      env:
        READ_TOKEN: "${{ github.token }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        B=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body|startswith("## DF_Intake"))] | last | .body')
        printf '### Hand-off → Build\n\n%s\n\n_Passed to Build as: the ## DF_Intake comment on issue #%s (the builder reads the issue + comments)._\n\n' "$B" "$ISSUE" >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' "$B"
        L=$(printf '%s\n' "$B" | tail -1)
        case "$L" in
          INTAKE=go) G=go ;;
          INTAKE=needs-info) G=needs-info ;;
          *) G= ;;
        esac
        if [ "$G" = go ] && [ "$(printf '%s\n' "$B" | jq -Rs '[split("\n")[] | select(startswith("FAST_LANE="))] == ["FAST_LANE=orch-direct"]')" = true ]; then
          gh api -X POST "repos/$R/issues/$ISSUE/comments" -f body='Routed to orchestrator - small fix lane' >/dev/null
          python3 "$RECEIPTS" stage-label --label factory:orch-direct
          gh api -X DELETE "repos/$R/issues/$ISSUE/labels/actions%3Ago" >/dev/null 2>&1 || true
          G=orch-direct
        else
          gh api -X DELETE "repos/$R/issues/$ISSUE/labels/factory%3Aorch-direct" >/dev/null 2>&1 || true
        fi
        echo "go=$G" >> "$GITHUB_OUTPUT"
        echo "intake: $G"
        test -n "$G"
      if: steps.resume.outputs.skip != 'true'
    - name: Save current-state completion receipt
      if: success() && steps.resume.outputs.skip != 'true'
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: 'python3 "$RECEIPTS" record intake

'
  build:
    name: Build
    needs:
    - admission
    - intake
    if: needs.admission.outputs.go == 'true' && (needs.intake.outputs.go == 'go')
    runs-on: [self-hosted, hetzner]
    timeout-minutes: 45
    outputs:
      stats: "${{ steps.gi.outputs.stats }}"
      pr: "${{ steps.pr.outputs.pr || steps.resume.outputs.pr }}"
    steps:
    - name: Load receipt and lease guard
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
        PR: ''
      run: |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:$PATH"
        P="$RUNNER_TEMP/factory-receipts-$GITHUB_RUN_ID.py"
        GH_TOKEN="$READ_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" "repos/$R/contents/tools/factory_receipts.py?ref=$GITHUB_SHA" > "$P"
        echo "RECEIPTS=$P" >> "$GITHUB_ENV"
    - name: Current issue, lease, and durable receipt
      id: resume
      env:
        READ_TOKEN: "${{ github.token }}"
        R: "${{ github.repository }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
        PR: ''
      run: |
        python3 "$RECEIPTS" guard --stage build
        python3 "$RECEIPTS" resume build
    - name: Checkout board sync
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: main
        path: board-stage
        sparse-checkout: tools/board_sync.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
      if: steps.resume.outputs.skip != 'true'
    - name: Set board stage to Building
      continue-on-error: true
      working-directory: board-stage
      env:
        GH_TOKEN: "${{ github.token }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        python3 tools/board_sync.py --repo "$R" --issue "$ISSUE" --stage "Building" --run-url "https://github.com/$R/actions/runs/$GITHUB_RUN_ID"
      if: steps.resume.outputs.skip != 'true'
    - name: Stage label
      env:
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        python3 "$RECEIPTS" stage-label --label factory:building
      if: steps.resume.outputs.skip != 'true'
    - name: Received ← Intake
      env:
        READ_TOKEN: "${{ github.token }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/opt/homebrew/bin:$PATH"
        W="$RUNNER_TEMP/pipe-build-$ISSUE"
        { echo "W=$W"; echo "STAGE=Build V1"; echo "MODEL=oauth-pool/gpt-5.6-sol"; echo "EFFORT=xhigh"; } >> "$GITHUB_ENV"
        rm -rf "$W"
        git clone --quiet "https://github.com/$R.git" "$W"
        cd "$W"
        git checkout -B "actions/issue-$ISSUE"
        GH_TOKEN="$READ_TOKEN" gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body|startswith("## DF_Intake"))] | last | .body' > received.md || true
        cat received.md
        printf '### Build received (from Intake)\n\n%s\n\n' "$(cat received.md)" >> "$GITHUB_STEP_SUMMARY"
      if: steps.resume.outputs.skip != 'true'
    - name: Builder from scratch
      env:
        STANDING_RULINGS: "${{ needs.intake.outputs.rulings }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        R: "${{ github.repository }}"
      run: |
        export PATH="/Users/joshuabretag/.local/npm-global/bin:/opt/homebrew/bin:$PATH"
        echo "T0=$(date +%s)" >> "$GITHUB_ENV"
        cd "$W"
        : "${STANDING_RULINGS:?Standing rulings missing; refusing to run without laws}"
        printf '%s\n\n' "$STANDING_RULINGS" > brief.md
        cat >> brief.md <<EOF
        You are DF_Builder. Read your card at $HOME/.omp/agent/agents/DF_Builder.md and follow it, with these overrides:
        - For bug issues (bug/type:bug label or Bug issue type), build and rework receipts require nonempty single-line fields on their own lines: Producer: <code path creating bad state>; Producer fix: <committed producer change>; Regeneration proof: <exact command and actual result recreating healthy state from clean/disposable inputs using the fixed producer>. Builders include these in the same DF_PR/HEAD_SHA or DF_REWORK/HEAD_SHA comment. Reviewers and QA independently verify that evidence against the changed producer and executed result; block/fail if missing. Rebase preserves this evidence for the resulting head. Operator repair, reset, restart, hand-edited output, or a recovery runbook is NOT producer-fix or regeneration proof.
        - You are IN a fresh checkout of $R on branch actions/issue-$ISSUE. Build issue #$ISSUE from scratch: read it with gh api repos/$R/issues/$ISSUE. Implement its Done-when exactly.
        - Gates: pnpm install --frozen-lockfile, pnpm run typecheck, pnpm run check:code-quality:changed, and the vitest files covering your changed paths (vitest run <changed test files>). Write the new tests red-green: show they fail before your fix and pass after.
        - When green: git add, git commit, git push -u origin actions/issue-$ISSUE. Open the PR via REST ONLY: gh api -X POST repos/$R/pulls -f base=main -f head=actions/issue-$ISSUE -f title='<short title> (#$ISSUE)' -f body='<evidence>'. The gh pr and gh issue subcommands are BANNED (GraphQL quota exhausted); every GitHub read/write goes through gh api (REST). Then comment on issue #$ISSUE: first line DF_PR=<pr number>, second line HEAD_SHA=<full head sha>, then a short evidence summary.
        - End your comment with a section '**Hand-off package (exactly what the Reviewer gets)**': 3 short bullets: What I changed (files), How I proved it (tests red-green), What to double-check. The reviewer reads PR #<pr> (diff + this comment).
