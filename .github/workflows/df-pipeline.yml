        R: "${{ github.repository }}"
      run: |
        B=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$R/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body|startswith("DF_PR="))] | last | .body')
        printf '%s\n' "$B"
        printf '### Hand-off → Review\n\n%s\n\n_Passed to Review as: the DF_PR comment on issue #%s plus the PR diff._\n\n' "$B" "$ISSUE" >> "$GITHUB_STEP_SUMMARY"
