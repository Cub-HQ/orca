      id: prepare
      if: steps.resume.outputs.skip != 'true'
      env:
        READ_TOKEN: "${{ github.token }}"
        CHECKS_TOKEN: "${{ github.token }}"
        STANDING_RULINGS: "${{ needs.intake.outputs.rulings }}"
        ISSUE: "${{ github.event.issue.number || inputs.issue }}"
        PR: "${{ needs.build.outputs.pr }}"
        R: "${{ github.repository }}"
      run: |
        set -euo pipefail
        : "${STANDING_RULINGS:?Standing rulings missing; refusing to run without laws}"
        python3 "$REVIEW_RUN" prepare --repo "$R" --pr "$PR" --issue "$ISSUE" --checkout "$W" --base "$BASE_SHA" --state "$REVIEW_STATE" --pipeline-stage review1
