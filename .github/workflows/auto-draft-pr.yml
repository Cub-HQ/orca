# Opens a draft PR when a branch is pushed, so a created PR never depends on the
# connector's create_pull_request tool. Logic lives in the shared reusable
# workflow; this file is only the trigger. Opt out per commit with [no-pr].
name: Auto draft PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-draft-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-draft-pr:
    uses: Cub-HQ/build-team-ops/.github/workflows/auto-draft-pr-reusable.yml@main
