---
name: factory-sweep
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: factory-sweep
  cancel-in-progress: false
jobs:
  sweep:
    name: Self-heal stale issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Sweep
      env:
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: python3 tools/factory_sweep.py
    - name: Report runner budget or outage
      env:
        GH_TOKEN: "${{ secrets.FACTORY_TOKEN || github.token }}"
      run: 'python3 tools/factory_runner_watch.py --repo "$GITHUB_REPOSITORY"

'
'on':
  schedule:
  - cron: "*/5 * * * *"
  workflow_dispatch: {}
